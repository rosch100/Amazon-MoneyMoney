name: Extension tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test-and-validate:
    name: Test & syntax checks
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: |
          set -euo pipefail
          files_list="$(mktemp)"
          trap 'rm -f "${files_list}"' EXIT
          git ls-files -z '*.py' > "${files_list}"
          mapfile -d '' -t files < "${files_list}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files tracked."
            exit 0
          fi
          for file in "${files[@]}"; do
            python3 -m py_compile "$file"
          done

      - name: Python unit tests (tracked tests/*.py)
        run: |
          set -euo pipefail
          files_list="$(mktemp)"
          trap 'rm -f "${files_list}"' EXIT
          git ls-files -z 'tests/*.py' > "${files_list}"
          mapfile -d '' -t files < "${files_list}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python tests tracked."
            exit 0
          fi
          for file in "${files[@]}"; do
            python3 "$file"
          done

      - name: Setup LuaJIT
        uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "luajit-2.1"
          buildCache: "false"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@ccc91d934fc4e0583abb56b4296799b010d6130c # v6.1.1

      - name: Install Lua test dependencies
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" != "Linux" ]; then
            echo "::error::Lua test dependencies are installed with apt-get; CI_RUNS_ON must select a Linux runner."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y libxml2-dev lua5.4
          luarocks --lua-version=5.1 install xmlua

      - name: Lua unit tests
        run: |
          set -euo pipefail
          files_list="$(mktemp)"
          trap 'rm -f "${files_list}"' EXIT
          git ls-files -z 'test/test_*.lua' 'test/selftest.lua' > "${files_list}"
          mapfile -d '' -t files < "${files_list}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Lua tests tracked."
            exit 1
          fi
          for file in "${files[@]}"; do
            ./test/run.sh "${file}"
          done

      - name: Lua syntax check (all tracked .lua)
        run: |
          set -euo pipefail
          files_list="$(mktemp)"
          trap 'rm -f "${files_list}"' EXIT
          git ls-files -z '*.lua' > "${files_list}"
          mapfile -d '' -t files < "${files_list}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Lua files tracked."
            exit 0
          fi
          # Standard Lua 5.4: LuaJIT accepts non-ASCII identifiers that standard Lua rejects.
          for file in "${files[@]}"; do
            luac5.4 -p "${file}"
          done
