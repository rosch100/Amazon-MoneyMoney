name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  secrets-pr:
    name: Secrets scan (gitleaks)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: nur für Organisations-Repos erforderlich (Personal Accounts: leer lassen).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  secrets-readonly:
    name: Secrets scan (gitleaks, push/schedule)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: nur für Organisations-Repos erforderlich (Personal Accounts: leer lassen).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  python-sast:
    name: Python SAST (bandit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install bandit
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install bandit==1.9.4

      - name: Run bandit (tracked Python files)
        run: |
          set -euo pipefail
          files_list="$(mktemp)"
          trap 'rm -f "${files_list}"' EXIT
          git ls-files -z '*.py' > "${files_list}"
          mapfile -d '' -t files < "${files_list}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files tracked."
            exit 0
          fi
          bandit -q "${files[@]}"
